name: Hanni Windows Test Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build Windows plugin
        shell: pwsh
        run: |
          ./.github/scripts/Build-Windows.ps1 -Target x64 -Configuration RelWithDebInfo

      - name: Package plugin
        shell: pwsh
        run: |
          ./.github/scripts/Package-Windows.ps1 -Target x64 -Configuration RelWithDebInfo

      - name: Upload test build
        uses: actions/upload-artifact@v4
        with:
          name: replay-buffer-pro-hanni-windows-test
          path: release/replay-buffer-pro-*-windows-x64.zip
          if-no-files-found: error
          retention-days: 14
